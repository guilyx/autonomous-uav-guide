[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flybots"
version = "1.0.0"
description = "From-scratch autonomous UAV algorithms: multirotor, fixed-wing and VTOL flight models, 42 runnable simulations and reinforcement-learning environments."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Erwin Lejeune", email = "erwin.lejeune15@gmail.com" }]
requires-python = ">=3.12"
keywords = [
    "uav",
    "drone",
    "quadrotor",
    "fixed-wing",
    "vtol",
    "robotics",
    "simulation",
    "control",
    "path-planning",
    "state-estimation",
    "reinforcement-learning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Education",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "matplotlib>=3.9",
]

[project.urls]
Homepage = "https://guilyx.github.io/flybots/"
Documentation = "https://guilyx.github.io/flybots/"
Repository = "https://github.com/guilyx/flybots"
Changelog = "https://github.com/guilyx/flybots/blob/main/CHANGELOG.md"
Issues = "https://github.com/guilyx/flybots/issues"

[project.scripts]
flybots = "uav_sim.cli.main:main"
# Kept while the import package is still `uav_sim`; see the deprecation
# notice in `uav_sim.cli.main`. Removed when the package itself is renamed.
uav-sim = "uav_sim.cli.main:main_deprecated_alias"

[project.optional-dependencies]
gym = ["gymnasium>=1.0"]
video = ["imageio-ffmpeg>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/uav_sim"]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-cov>=6.0",
    "pre-commit>=4.0",
    "ruff>=0.8",
    "mypy>=1.13",
    # Bundled ffmpeg binary, used by scripts/make_promo.py.
    "imageio-ffmpeg>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:launch_testing -p no:launch_ros"

[tool.ruff]
target-version = "py312"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
