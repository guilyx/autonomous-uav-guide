# Erwin Lejeune - 2026-02-18

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-groups
      - name: Run pre-commit checks
        uses: pre-commit/action@v3.0.1

  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --all-groups
      - name: Run tests
        run: uv run pytest -q --cov=uav_sim --cov-report=xml --cov-report=term-missing
      - name: Upload coverage
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: warn

  smoke:
    name: CLI smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-groups
      - name: Physics self-check
        run: uv run uav-sim doctor
      - name: Catalogue is discoverable
        run: |
          uv run uav-sim list
          uv run uav-sim envs
      - name: Trim solver
        run: uv run uav-sim trim skywalker_x8
      - name: Training loop runs end to end
        run: uv run uav-sim train hover --iterations 3 --directions 4 --eval-episodes 3

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
        working-directory: docs
      - run: npm run build
        working-directory: docs
